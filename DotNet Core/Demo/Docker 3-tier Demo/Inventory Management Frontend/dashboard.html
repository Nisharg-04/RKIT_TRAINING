<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Inventory System</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Products</h2>
        <button class="btn btn-success" onclick="openModal()"><i class="fas fa-plus"></i> Add Product</button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="prodId">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="prodName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" step="0.01" class="form-control" id="prodPrice" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" class="form-control" id="prodQty" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Auth Check
    const token = localStorage.getItem('authToken');
    if (!token) window.location.href = 'index.html';

    const apiBase = '/api/products';
    let productModal;

    $(document).ready(function() {
        productModal = new bootstrap.Modal(document.getElementById('productModal'));
        loadProducts();

        // Handle Form Submit (Create or Update)
        $('#productForm').submit(function(e) {
            e.preventDefault();
            const id = $('#prodId').val();
            const product = {
                id: id ? parseInt(id) : 0, // 0 or null for new, depending on backend
                name: $('#prodName').val(),
                price: parseFloat($('#prodPrice').val()),
                quantity: parseInt($('#prodQty').val())
            };

            // Determine method and URL based on ID existence
            const method = id ? 'PUT' : 'POST';
            
            $.ajax({
                url: apiBase,
                type: method,
                headers: { 'Authorization': 'Bearer ' + token },
                contentType: 'application/json',
                data: JSON.stringify(product),
                success: function() {
                    productModal.hide();
                    loadProducts();
                },
                error: function(xhr) {
                    alert('Error saving product: ' + xhr.statusText);
                }
            });
        });
    });

    // Fetch Products
    function loadProducts() {
        $.ajax({
            url: apiBase,
            type: 'GET',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function(data) {
                const tbody = $('#productTableBody');
                tbody.empty();
                data.forEach(p => {
                    tbody.append(`
                        <tr>
                            <td>${p.id}</td>
                            <td>${p.name}</td>
                            <td>$${p.price.toFixed(2)}</td>
                            <td>${p.quantity}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary me-2" 
                                    onclick="editProduct(${p.id}, '${p.name}', ${p.price}, ${p.quantity})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `);
                });
            },
            error: function(xhr) {
                if(xhr.status === 401 || xhr.status === 403) logout();
            }
        });
    }

    // Prepare Modal for Edit
    function editProduct(id, name, price, qty) {
        $('#modalTitle').text('Edit Product');
        $('#prodId').val(id);
        $('#prodName').val(name);
        $('#prodPrice').val(price);
        $('#prodQty').val(qty);
        productModal.show();
    }

    // Open Modal for Create
    function openModal() {
        $('#modalTitle').text('Add Product');
        $('#productForm')[0].reset();
        $('#prodId').val(''); 
        productModal.show();
    }

    // Delete Product
    function deleteProduct(id) {
        if(!confirm('Are you sure?')) return;
        $.ajax({
            url: `${apiBase}/${id}`,
            type: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function() {
                loadProducts();
            }
        });
    }

    function logout() {
        localStorage.removeItem('authToken');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
