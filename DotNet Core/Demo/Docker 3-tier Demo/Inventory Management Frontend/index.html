<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">Inventory Login</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" value="manager" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" value="manager123" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
        <div id="error-msg" class="text-danger mt-3 text-center" style="display:none;"></div>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        // Clear old tokens on load
        localStorage.removeItem('authToken');

        $('#loginForm').submit(function(e) {
            e.preventDefault();
            
            const loginData = {
                username: $('#username').val(),
                password: $('#password').val()
            };

            $.ajax({
                url: '/api/auth/login',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(loginData),
                success: function(response) {
                    // Assuming response is the token string or object {token: "..."}
                    // Adjust based on your actual API response format
                    const token = response.token || response; 
                    console.log(token);
                    localStorage.setItem('authToken', token);
                    window.location.href = 'dashboard.html';
                },
                error: function(xhr) {
                    $('#error-msg').text("Login failed. Please check credentials.").show();
                }
            });
        });
    });
</script>
</body>
</html>
