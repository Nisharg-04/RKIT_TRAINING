<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async API Correct Demo</title>
</head>
<body>

<script>
    const p1 = async function () {
        const userResponse = await fetch("https://jsonplaceholder.typicode.com/users/1");
        const user = await userResponse.json();
        await new Promise((resolve) => setTimeout(resolve, 2000));
        return user; 
    };

    const p2 = async function (id) {
        const postsResponse = await fetch(
            `https://jsonplaceholder.typicode.com/posts?userId=${id}`
        );
        const posts = await postsResponse.json();
        return posts; 
    };

    async function resolvePromises() {
        console.log("Function enter");

        const result1 = await p1();
        console.log("After p1");
        console.log(result1);


        const result2 = await p2(result1.id); 
        console.log("After p2");
        console.log(result2);

        console.log("Function leave");
    }

    resolvePromises();
</script>

</body>
</html>
